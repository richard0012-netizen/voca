<html lang="ko">
<head>

<title>EBS Voca Trainer - 바로 실행</title>
<style>
:root {

  --green:#15a46b; --green-soft:#e8f8f1; --red:#e24b4b; --red-soft:#fff0f0;

}
*{box-sizing:border-box}
body{
  margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);
  background:radial-gradient(circle at top left,rgba(56,103,255,.13),transparent 36%),var(--bg)
}
.wrap{max-width:1180px;margin:0 auto;padding:22px}
.header{
  display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px
}
.brand{display:flex;align-items:center;gap:13px}
.logo{width:52px;height:52px;border-radius:17px;background:var(--soft);display:grid;place-items:center;font-size:28px}
h1{font-size:24px;margin:0;letter-spacing:-.03em} p{color:var(--muted)} .brand p{margin:4px 0 0;font-size:13px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.nav button,.btn{

}
.nav button.active,.primary{background:var(--primary)!important;color:white!important;box-shadow:0 10px 20px rgba(56,103,255,.23)}
.btn:hover,.nav button:hover{transform:translateY(-1px)} .secondary{background:var(--soft)!important;color:var(--primary2)!important}
.danger{color:var(--red)!important} .ghost{background:#eef2f8!important;color:#293246!important}
.grid{display:grid;gap:16px} .cols3{grid-template-columns:repeat(3,minmax(0,1fr))} .cols2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.metric h3{margin:0 0 9px;color:var(--muted);font-size:14px} .metric strong{font-size:34px;letter-spacing:-.04em}
.progress{height:12px;background:#e8ecf4;border-radius:999px;overflow:hidden} .progress div{height:100%;background:linear-gradient(90deg,var(--primary),#6a8cff)}
.page{display:none} .page.active{display:block}
.title{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin:8px 0 18px} h2{font-size:30px;margin:0;letter-spacing:-.04em} .title p{margin:7px 0 0}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.learnLayout{display:grid;grid-template-columns:1fr 310px;gap:16px}
.flash{
  min-height:360px;display:grid;place-items:center;text-align:center;border-radius:28px;border:1px solid var(--line);
  background:linear-gradient(135deg,rgba(56,103,255,.08),rgba(255,255,255,.92)),white;box-shadow:var(--shadow);
  padding:36px;user-select:none;cursor:pointer
}
.flash .word{font-size:clamp(36px,7vw,68px);font-weight:850;letter-spacing:-.05em;line-height:1.08;overflow-wrap:anywhere}
.flash .meaning{font-size:clamp(19px,3vw,29px);color:var(--muted);margin-top:18px;line-height:1.35;overflow-wrap:anywhere}
.tag{display:inline-flex;border-radius:999px;background:#f1f4fa;color:var(--muted);padding:5px 10px;font-size:12px;margin:0 3px 12px}
.good{background:var(--green-soft);color:var(--green)} .bad{background:var(--red-soft);color:var(--red)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
input,select{border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;background:white;outline:none}
.search{flex:1;min-width:min(100%,310px)}
.wordList{display:grid;gap:10px} .row{display:grid;grid-template-columns:minmax(150px,.9fr) minmax(210px,1.5fr) auto;gap:12px;align-items:center;background:white;border:1px solid var(--line);border-radius:16px;padding:14px}
.row b,.row div{overflow-wrap:anywhere} .mean{color:var(--muted)} .empty{padding:35px;border:1px dashed #c9d2e3;border-radius:var(--r);text-align:center;color:var(--muted);background:rgba(255,255,255,.65)}
.quizQ{font-size:clamp(28px,5vw,48px);letter-spacing:-.05em;margin:12px 0 24px;line-height:1.15;overflow-wrap:anywhere}
.choices{display:grid;gap:10px} .choice{width:100%;text-align:left;border:1px solid var(--line);background:white;border-radius:14px;padding:13px;cursor:pointer;font:inherit}
.choice:hover:not(:disabled){border-color:var(--primary);background:var(--soft)} .choice.correct{background:var(--green-soft);border-color:var(--green);color:var(--green)} .choice.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.result{margin-top:16px;background:#f5f7fb;border-radius:16px;padding:14px;color:var(--muted)} .muted{color:var(--muted)} hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#172033;color:white;padding:12px 16px;border-radius:999px;opacity:0;transition:.18s;pointer-events:none;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:850px){.cols3,.cols2,.learnLayout{grid-template-columns:1fr}.header,.title{display:block}.actions{margin-top:12px}.row{grid-template-columns:1fr}}
</style>
</head>

const KEY='ebs-voca-trainer-single-state-v1';
const SKEY='ebs-voca-trainer-single-settings-v1';
const DEF={dailyGoal:20,quizCount:10,direction:'en-ko',review:true};
let state=load(KEY,{progress:{},sessions:{},quizResults:[],streak:{last:null,count:0}});
let settings={...DEF,...load(SKEY,{})};
let learnSession=[],learnIdx=0,flipped=false,quizSession=[],quizIdx=0,quizScore=0,answered=false;

function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function saveSet(){localStorage.setItem(SKEY,JSON.stringify(settings))}
function day(dt=new Date()){return dt.toISOString().slice(0,10)}
function addDays(n){let d=new Date();d.setDate(d.getDate()+n);return d.toISOString()}
function esc(v){return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
function progress(id){return state.progress[id]||{status:'new',correct:0,wrong:0,known:0,unknown:0,last:null,next:null,book:false}}
function ensure(id){if(!state.progress[id]) state.progress[id]=progress(id); return state.progress[id]}
function pct(a,b){return b?Math.round(a/b*100):0}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sample(a,n){return shuffle(a).slice(0,n)}
function due(w){let p=progress(w.id);return p.next&&new Date(p.next)<=new Date()}
function label(s){return {new:'미학습',learning:'학습 중',difficult:'어려움',wrong:'오답',mastered:'암기 완료'}[s]||s}
function cls(s){return s==='mastered'?'good':(s==='wrong'||s==='difficult'?'bad':'')}
function toast(m){let t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}
function studyDay(){let t=day(); if(state.streak.last===t)return; let y=new Date(); y.setDate(y.getDate()-1); state.streak.count=state.streak.last===day(y)?state.streak.count+1:1; state.streak.last=t}
function stats(){let vals=Object.values(state.progress), total=VOCAB.length, learned=vals.filter(p=>p.status!=='new').length, mastered=vals.filter(p=>p.status==='mastered').length, difficult=vals.filter(p=>p.status==='wrong'||p.status==='difficult').length, correct=state.quizResults.filter(r=>r.ok).length; return {total,learned,mastered,difficult,due:VOCAB.filter(due).length,correct,qtotal:state.quizResults.length,acc:pct(correct,state.quizResults.length),overall:pct(mastered,total)}}
function todayWords(){let t=day(); if(state.sessions[t]?.ids?.length) return state.sessions[t].ids.map(id=>VOCAB.find(w=>w.id===id)).filter(Boolean); let goal=+settings.dailyGoal||20, reviews=settings.review?sample(VOCAB.filter(due),Math.ceil(goal*.3)):[], news=sample(VOCAB.filter(w=>progress(w.id).status==='new'&&!reviews.some(r=>r.id===w.id)),goal-reviews.length), words=[...reviews,...news]; if(words.length<goal) words.push(...sample(VOCAB.filter(w=>!words.some(x=>x.id===w.id)&&progress(w.id).status!=='mastered'),goal-words.length)); state.sessions[t]={ids:words.map(w=>w.id),done:[],created:new Date().toISOString()}; save(); return words}
function doneCount(){return state.sessions[day()]?.done?.length||0}
function complete(id){let t=day(); if(!state.sessions[t]) state.sessions[t]={ids:[],done:[]}; if(!state.sessions[t].done.includes(id)) state.sessions[t].done.push(id)}

document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>page(b.dataset.page));
function page(name){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(name).classList.add('active');({home:renderHome,learn:renderLearn,quiz:renderQuiz,wrong:renderWrong,words:renderWords,stats:renderStats,settings:renderSettings}[name])()}

function renderHome(){let s=stats(), tw=todayWords(), dc=doneCount(); home.innerHTML=`
<div class="title"><div><h2>오늘의 학습 📘</h2><p>하루 목표를 달성하고 퀴즈로 암기를 확인하세요.</p></div><div class="actions"><button class="btn primary" onclick="startLearn()">학습 시작</button><button class="btn secondary" onclick="startQuiz()">퀴즈 풀기</button></div></div>
<div class="grid cols3">
 <div class="card metric"><h3>오늘 학습</h3><strong>${dc}/${tw.length}</strong><p>단어 완료</p><div class="progress"><div style="width:${pct(dc,tw.length)}%"></div></div></div>
 <div class="card metric"><h3>전체 암기</h3><strong>${s.overall}%</strong><p>${s.mastered}/${s.total}개 완료</p><div class="progress"><div style="width:${s.overall}%"></div></div></div>
 <div class="card metric"><h3>연속 학습</h3><strong>${state.streak.count}</strong><p>일째</p></div>
</div>
<div class="grid cols2" style="margin-top:16px">
 <div class="card"><h3>빠른 메뉴</h3><p>복습 예정 ${s.due}개, 어려운 단어 ${s.difficult}개가 있어요.</p><div class="actions"><button class="btn primary" onclick="startLearn()">오늘 단어</button><button class="btn secondary" onclick="startLearn('wrong')">어려운 단어</button><button class="btn ghost" onclick="page('words')">단어 검색</button></div></div>
 <div class="card"><h3>학습 요약</h3><p>학습한 단어: <b>${s.learned}</b>개</p><p>퀴즈 정답률: <b>${s.acc}%</b> (${s.correct}/${s.qtotal})</p></div>
</div>`}

function startLearn(mode='today'){learnSession=mode==='wrong'?VOCAB.filter(w=>['wrong','difficult'].includes(progress(w.id).status)):mode==='review'?VOCAB.filter(due):todayWords(); if(!learnSession.length) learnSession=todayWords(); learnIdx=0; flipped=false; page('learn')}
function renderLearn(){let w=learnSession[learnIdx]; if(!w){learn.innerHTML=`<div class="title"><div><h2>카드 학습 완료 🎉</h2><p>이제 퀴즈로 확인해보세요.</p></div><div class="actions"><button class="btn primary" onclick="startQuiz()">퀴즈 풀기</button><button class="btn ghost" onclick="page('home')">홈</button></div></div>`;return} let p=progress(w.id); learn.innerHTML=`
<div class="title"><div><h2>카드 학습</h2><p>${learnIdx+1}/${learnSession.length} · 카드를 클릭하면 뒤집힙니다.</p></div><div class="actions"><button class="btn ghost" onclick="startLearn('review')">복습</button><button class="btn ghost" onclick="startLearn('wrong')">어려운 단어</button></div></div>
<div class="learnLayout"><div><div class="flash" onclick="flipped=!flipped;renderLearn()"><div><span class="tag ${cls(p.status)}">${label(p.status)}</span><span class="tag">${w.type==='phrase'?'표현':'단어'}</span><div class="word">${esc(flipped?w.meaning:w.word)}</div><div class="meaning">${flipped?esc(w.word):'뜻을 보려면 클릭하세요'}</div></div></div>
<div class="actions" style="margin-top:14px"><button class="btn ghost" onclick="learnIdx=Math.max(0,learnIdx-1);flipped=false;renderLearn()">이전</button><button class="btn secondary" onclick="flipped=!flipped;renderLearn()">뒤집기</button><button class="btn primary" onclick="markKnown(${w.id})">알고 있음</button><button class="btn danger" onclick="markUnknown(${w.id})">모름</button><button class="btn ghost" onclick="learnIdx++;flipped=false;renderLearn()">건너뛰기</button></div></div>
<div class="card"><h3>단어 정보</h3><p>정답 횟수: <b>${p.correct}</b></p><p>오답 횟수: <b>${p.wrong}</b></p><p>다음 복습: <b>${p.next?p.next.slice(0,10):'미정'}</b></p><div class="progress"><div style="width:${pct(learnIdx,learnSession.length)}%"></div></div></div></div>`}
function markKnown(id){let p=ensure(id);p.known++;p.status=(p.known>=3||p.correct>=2)?'mastered':'learning';p.last=new Date().toISOString();p.next=addDays(p.status==='mastered'?30:3);complete(id);studyDay();save();toast('알고 있음으로 저장했어요 ✅');learnIdx++;flipped=false;renderLearn()}
function markUnknown(id){let p=ensure(id);p.unknown++;p.status='difficult';p.last=new Date().toISOString();p.next=addDays(1);complete(id);studyDay();save();toast('내일 다시 복습할게요 🔁');learnIdx++;flipped=false;renderLearn()}

function startQuiz(){let learned=VOCAB.filter(w=>progress(w.id).status!=='new');let pool=learned.length>=4?learned:VOCAB;quizSession=sample(pool,Math.min(+settings.quizCount||10,pool.length));quizIdx=0;quizScore=0;answered=false;page('quiz')}
function quizObj(w){let dir=settings.direction, q=dir==='ko-en'?w.meaning:w.word, ans=dir==='ko-en'?w.word:w.meaning, pool=VOCAB.filter(x=>x.id!==w.id).map(x=>dir==='ko-en'?x.word:x.meaning); return {q,ans,opts:shuffle([ans,...sample(pool,3)])}}
function renderQuiz(){if(!quizSession.length)startQuiz();let w=quizSession[quizIdx]; if(!w){let r=pct(quizScore,quizSession.length);quiz.innerHTML=`<div class="title"><div><h2>퀴즈 완료 🎯</h2><p>${quizSession.length}문제 중 ${quizScore}문제 정답</p></div><div class="actions"><button class="btn primary" onclick="startQuiz()">다시 풀기</button><button class="btn ghost" onclick="page('home')">홈</button></div></div><div class="card metric"><h3>정답률</h3><strong>${r}%</strong><div class="progress"><div style="width:${r}%"></div></div></div>`;return} let q=quizObj(w); quiz.innerHTML=`<div class="title"><div><h2>퀴즈</h2><p>${quizIdx+1}/${quizSession.length}</p></div><button class="btn secondary" onclick="startQuiz()">새 퀴즈</button></div><div class="card"><span class="tag">4지선다</span><div class="quizQ">${esc(q.q)}</div><div class="choices">${q.opts.map((o,i)=>`<button class="choice" onclick="answerQuiz(${w.id},this)" data-ans="${esc(q.ans)}" data-opt="${esc(o)}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div><div id="qres" class="result" style="display:none"></div><div class="actions" style="margin-top:14px"><button id="nextQ" class="btn primary" style="display:none" onclick="quizIdx++;answered=false;renderQuiz()">다음</button></div></div>`}
function answerQuiz(id,btn){if(answered)return;answered=true;let opt=btn.dataset.opt, ans=btn.dataset.ans, ok=opt===ans, w=VOCAB.find(x=>x.id===id), p=ensure(id);document.querySelectorAll('.choice').forEach(c=>{c.disabled=true;if(c.dataset.opt===ans)c.classList.add('correct');if(c===btn&&!ok)c.classList.add('wrong')});if(ok){quizScore++;p.correct++;p.status=p.correct>=3?'mastered':'learning';p.next=addDays(p.status==='mastered'?30:7)}else{p.wrong++;p.status='wrong';p.next=addDays(1)}p.last=new Date().toISOString();state.quizResults.push({id,opt,ans,ok,at:new Date().toISOString()});complete(id);studyDay();save();qres.style.display='block';qres.innerHTML=ok?`정답입니다 ✅ <b>${esc(w.word)}</b> = ${esc(w.meaning)}`:`오답입니다. 정답은 <b>${esc(ans)}</b> 입니다.`;nextQ.style.display='inline-flex'}

function row(w,action=false){let p=progress(w.id);return `<div class="row"><div><b>${esc(w.word)}</b><br><span class="tag ${cls(p.status)}">${label(p.status)}</span></div><div class="mean">${esc(w.meaning)}</div><div class="actions"><button class="btn ghost" onclick="book(${w.id})">${p.book?'★':'☆'}</button>${action?`<button class="btn secondary" onclick="master(${w.id})">완료</button>`:''}</div></div>`}
function renderWrong(){let arr=VOCAB.filter(w=>['wrong','difficult'].includes(progress(w.id).status)||progress(w.id).wrong>0).sort((a,b)=>progress(b.id).wrong-progress(a.id).wrong); wrong.innerHTML=`<div class="title"><div><h2>오답노트 🔁</h2><p>틀린 단어와 모르는 단어만 모았습니다.</p></div><button class="btn primary" onclick="startLearn('wrong')">오답 학습</button></div>${arr.length?`<div class="wordList">${arr.map(w=>row(w,true)).join('')}</div>`:'<div class="empty">아직 오답 단어가 없습니다.</div>'}`}
function renderWords(){words.innerHTML=`<div class="title"><div><h2>전체 단어장</h2><p>총 ${VOCAB.length}개의 단어/표현</p></div></div><div class="toolbar"><input id="search" class="search" placeholder="단어 또는 뜻 검색" oninput="wordList()"><select id="filter" onchange="wordList()"><option value="all">전체</option><option value="new">미학습</option><option value="learning">학습 중</option><option value="mastered">암기 완료</option><option value="wrong">오답/어려움</option><option value="book">즐겨찾기</option></select></div><div id="list" class="wordList"></div>`;wordList()}
function wordList(){let q=(search?.value||'').toLowerCase().trim(), f=filter?.value||'all';let arr=VOCAB.filter(w=>{let p=progress(w.id),mq=!q||w.word.toLowerCase().includes(q)||w.meaning.toLowerCase().includes(q), mf=f==='all'||(f==='wrong'&&['wrong','difficult'].includes(p.status))||(f==='book'&&p.book)||p.status===f;return mq&&mf});list.innerHTML=(arr.slice(0,220).map(w=>row(w)).join('')+(arr.length>220?`<div class="empty">${arr.length}개 중 220개만 표시합니다.</div>`:''))||'<div class="empty">검색 결과가 없습니다.</div>'}
function renderStats(){let s=stats();let top=VOCAB.filter(w=>progress(w.id).wrong||progress(w.id).unknown).sort((a,b)=>(progress(b.id).wrong+progress(b.id).unknown)-(progress(a.id).wrong+progress(a.id).unknown)).slice(0,10);stats.innerHTML=`<div class="title"><div><h2>학습 통계 📊</h2><p>학습 현황을 확인하세요.</p></div></div><div class="grid cols3"><div class="card metric"><h3>전체 단어</h3><strong>${s.total}</strong></div><div class="card metric"><h3>학습한 단어</h3><strong>${s.learned}</strong></div><div class="card metric"><h3>암기 완료</h3><strong>${s.mastered}</strong></div><div class="card metric"><h3>어려운 단어</h3><strong>${s.difficult}</strong></div><div class="card metric"><h3>정답률</h3><strong>${s.acc}%</strong></div><div class="card metric"><h3>연속 학습</h3><strong>${state.streak.count}</strong></div></div><div class="card" style="margin-top:16px"><h3>취약 단어 TOP 10</h3>${top.length?top.map(w=>row(w)).join(''):'<p class="muted">아직 데이터가 없습니다.</p>'}</div>`}
function renderSettings(){settings.innerHTML=`<div class="title"><div><h2>설정</h2><p>학습량과 퀴즈 방식을 설정합니다.</p></div></div><div class="card" style="max-width:620px"><label>하루 학습 단어 수<br><input id="daily" type="number" min="5" max="100" value="${settings.dailyGoal}"></label><hr><label>퀴즈 문제 수<br><input id="qc" type="number" min="5" max="50" value="${settings.quizCount}"></label><hr><label>퀴즈 방향<br><select id="dir"><option value="en-ko" ${settings.direction==='en-ko'?'selected':''}>영어 → 한국어</option><option value="ko-en" ${settings.direction==='ko-en'?'selected':''}>한국어 → 영어</option></select></label><hr><label><input id="rev" type="checkbox" ${settings.review?'checked':''}> 오늘의 학습에 복습 단어 포함</label><div class="actions" style="margin-top:18px"><button class="btn primary" onclick="saveSettings()">저장</button></div></div>`}
function saveSettings(){settings.dailyGoal=+daily.value||20;settings.quizCount=+qc.value||10;settings.direction=dir.value;settings.review=rev.checked;saveSet();delete state.sessions[day()];save();toast('설정을 저장했습니다')}
function book(id){let p=ensure(id);p.book=!p.book;save();toast(p.book?'즐겨찾기 추가':'즐겨찾기 해제');page(document.querySelector('.page.active').id)}
function master(id){let p=ensure(id);p.status='mastered';p.next=addDays(30);save();toast('암기 완료 처리했습니다');renderWrong()}
function resetAll(){if(confirm('학습 기록을 모두 초기화할까요?')){localStorage.removeItem(KEY);state=load(KEY,{progress:{},sessions:{},quizResults:[],streak:{last:null,count:0}});toast('초기화했습니다');page('home')}}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ebs_voca_learning_record.json';a.click();URL.revokeObjectURL(a.href)}
renderHome();
</script>
</body>
</html>
